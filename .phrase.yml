# Phrase CLI configuration (Strings)
# Docs: https://support.phrase.com/hc/en-us/articles/5784093898908
#
# access_token and project_id are intentionally NOT set here.
# .phrase.yml does not expand $VAR syntax - it would be read as a
# literal string and sent as the token (causing 401 Unauthorized).
# Instead:
#   - PHRASE_ACCESS_TOKEN is read automatically from the environment.
#   - project_id is passed explicitly via --project_id on the CLI
#     command (see .github/workflows/phrase-*.yml), which the shell
#     expands correctly.

phrase:
  push:
    sources:
      - file: ./Resources/Resources.resx
        file_format: resx
        params:
          locale_id: en
          update_translations: true

  pull:
    targets:
      - file: ./Resources/Resources.<locale_code>.resx
        file_format: resx
        params:
          # Pulls every locale in the project except the source (en)
          include_empty_translations: false
