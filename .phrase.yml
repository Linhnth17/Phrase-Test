# Phrase CLI configuration (Strings)
# Docs: https://support.phrase.com/hc/en-us/articles/5784093898908
#
# access_token is intentionally NOT set here - .phrase.yml does not
# expand $VAR syntax (it would be sent as the literal string, causing
# 401 Unauthorized). It's passed via --access_token on the CLI command
# instead (see .github/workflows/phrase-*.yml), where the shell
# expands the PHRASE_ACCESS_TOKEN env var correctly.
#
# project_id has no CLI flag equivalent (`phrase push --project_id=..`
# errors with "unknown flag"), so it must live here. It's not a secret.

phrase:
  project_id: 676b516aed3001e0832302a9060d154f

  push:
    sources:
      - file: ./Resources/Resources.resx
        file_format: resx
        params:
          locale_id: en
          update_translations: true

  pull:
    targets:
      - file: ./Resources/Resources.<locale_code>.resx
        file_format: resx
        params:
          # Pulls every locale in the project except the source (en)
          include_empty_translations: false
