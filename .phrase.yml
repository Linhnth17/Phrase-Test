# Phrase CLI configuration (Strings)
# Docs: https://support.phrase.com/hc/en-us/articles/5784093898908
#
# access_token is intentionally NOT set here - .phrase.yml does not
# expand $VAR syntax (it would be sent as the literal string, causing
# 401 Unauthorized). It's passed via --access_token on the CLI command
# instead (see .github/workflows/phrase-*.yml), where the shell
# expands the PHRASE_ACCESS_TOKEN env var correctly.
#
# project_id has no CLI flag equivalent (`phrase push --project_id=..`
# errors with "unknown flag"), so it must live here. It's not a secret.
#
# 3 projects, 3 separate resx files -> each source/target is tagged so
# keys don't mix and pull routes translations back to the right file.
# `tag`/`tags` must be a top-level key on the source/target entry, not
# nested under `params` (CLI errors with "invalid keys: tag" otherwise).

phrase:
  project_id: 676b516aed3001e0832302a9060d154f

  push:
    sources:
      - file: ./Properties/Resources.resx
        file_format: resx
        tag: mainapp
        params:
          locale_id: en
          update_translations: true

      - file: ./OrderService/Properties/Resources.resx
        file_format: resx
        tag: orderservice
        params:
          locale_id: en
          update_translations: true

      - file: ./PaymentService/Properties/Resources.resx
        file_format: resx
        tag: paymentservice
        params:
          locale_id: en
          update_translations: true

  pull:
    targets:
      - file: ./Properties/Resources.<locale_code>.resx
        file_format: resx
        tags: mainapp
        params:
          include_empty_translations: false

      - file: ./OrderService/Properties/Resources.<locale_code>.resx
        file_format: resx
        tags: orderservice
        params:
          include_empty_translations: false

      - file: ./PaymentService/Properties/Resources.<locale_code>.resx
        file_format: resx
        tags: paymentservice
        params:
          include_empty_translations: false
