name: Pull translations from Phrase

# Runs on demand (or on a schedule) to fetch whatever translators have
# edited/completed in the Phrase UI, then raises a PR back into main.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  pull-from-phrase:
    runs-on: ubuntu-latest
    env:
      PHRASE_ACCESS_TOKEN: ${{ secrets.PHRASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: phrase/setup-cli@v1
        with:
          version: 2.65.0

      - name: Pull translations from Phrase
        run: phrase pull --access_token="$PHRASE_ACCESS_TOKEN"

      - name: Open pull request with updated translations
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore(i18n): update translations from Phrase"
          title: "chore(i18n): update translations from Phrase"
          body: |
            Automated update pulled from Phrase.
            Review the translated `Resources.*.resx` files before merging.
          branch: phrase-translations-update
          delete-branch: true
          add-paths: |
            Properties/Resources.*.resx
            OrderService/Properties/Resources.*.resx
            PaymentService/Properties/Resources.*.resx
