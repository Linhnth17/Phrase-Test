name: Push source strings to Phrase

# Runs whenever the English resx (source of truth) changes on main.
# Phrase picks up the new/changed keys and they become editable in the Phrase UI.
on:
  push:
    branches: [main]
    paths:
      - "Resources/Resources.resx"

jobs:
  push-to-phrase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push strings to Phrase
        uses: phrase/phrase-cli-action@v2
        with:
          command: push
        env:
          PHRASE_ACCESS_TOKEN: ${{ secrets.PHRASE_ACCESS_TOKEN }}
          PHRASE_PROJECT_ID: ${{ secrets.PHRASE_PROJECT_ID }}
